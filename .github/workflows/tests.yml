name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tkinter and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Run the suite under a virtual display
        run: xvfb-run -a python3 -m unittest discover -s tests -t .
